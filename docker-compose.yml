services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chat_agent
      POSTGRES_PASSWORD: chat_agent
      POSTGRES_DB: chat_agent
    ports:
      - "5432:5432"
    volumes:
      - chat-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_agent -d chat_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chat-agent-postgres:
