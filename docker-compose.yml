services:
  chat-agent:
    build:
      context: .
      args:
        GOPROXY: https://goproxy.cn,direct
    image: chat-agent:local
    container_name: chat-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"
    env_file:
      - .env
    environment:
      SERVER_PORT: "9998"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
